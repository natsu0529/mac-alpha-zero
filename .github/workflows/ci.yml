name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Silicon runner. Hosted runners may not expose the Metal GPU, so tests
    # must pass on the MLX CPU device; speed is measured locally, not in CI.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
